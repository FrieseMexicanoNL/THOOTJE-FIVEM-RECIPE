<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THOOTJE Garage</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app" class="hidden"><header><div class="brand"><div class="brand-icon">T</div><div><small>THOOTJE AUTOMOTIVE</small><h1 id="garageName">Garage</h1><p>Jouw voertuigen. Altijd binnen handbereik.</p></div></div><button class="close" id="close">✕</button></header>
<div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="Zoek op voertuig of kenteken..."></div><div class="counter" id="counter">0 VOERTUIGEN</div></div>
<div class="layout"><aside><div class="side-title">GARAGE MENU</div><button class="side active" data-filter="all">Alle voertuigen <b id="allCount">0</b></button><button class="side" data-filter="stored">In de garage <b id="storedCount">0</b></button><button class="side" data-filter="out">Buiten de garage <b id="outCount">0</b></button><button class="side" data-filter="impounded">In beslagname <b id="impoundCount">0</b></button><div class="side-note"><strong>GARAGE TIP</strong><p>Parkeer je voertuig op de marker om schade, brandstof en tuning op te slaan.</p></div><button id="storeCurrent" class="store-btn">＋ Voertuig parkeren</button></aside>
<section class="content"><div class="section-head"><div><span class="eyebrow">VOERTUIGENOVERZICHT</span><h2 id="listTitle">Mijn voertuigen</h2></div><button id="refresh" class="refresh">↻ Verversen</button></div><div id="vehicleGrid" class="grid"></div></section></div>
<footer><span>THOOTJE GARAGE <i>● ONLINE</i></span><span>ESC OM TE SLUITEN</span></footer></main><script src="app.js"></script></body></html>
