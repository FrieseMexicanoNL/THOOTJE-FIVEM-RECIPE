<!doctype html>
<html lang="nl">
<head>

<title>THOOTJE EMS MDT</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">

      <div class="page-head"><div><small>AMBULANCECENTRALE / OPERATIONEEL</small><h1 id="page-title">Overzicht</h1></div><button class="refresh" id="refresh">↻ Vernieuwen</button></div>
