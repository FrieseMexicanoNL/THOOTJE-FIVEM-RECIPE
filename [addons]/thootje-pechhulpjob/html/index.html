<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THOOTJE Pechhulp</title><link rel="stylesheet" href="style.css"></head><body><main id="app" class="hidden"><header><div><small>THOOTJE MOBILITY SERVICES</small><h1>Pechhulp <b>Control</b></h1></div><div class="status"><i></i> SYSTEEM ONLINE</div><button id="close">✕</button></header><nav><button class="active" data-tab="meldingen">Meldingen</button><button data-tab="voertuig">Voertuigcontrole</button><button data-tab="werkplaats">Werkplaats</button><button data-tab="facturen">Facturen</button></nav><section id="meldingen" class="page active"><h2>Actieve meldingen</h2><div id="calls" class="grid"></div></section><section id="voertuig" class="page"><h2>Voertuig controleren</h2><div class="panel form"><input id="plate" placeholder="Kenteken"><button id="lookup">Voertuiggegevens ophalen</button><button id="diagnostic">OBD-diagnose uitvoeren (dichtbij voertuig)</button><div id="vehicleInfo"></div><input id="mileage" type="number" placeholder="Kilometerstand"><textarea id="inspectionNote" placeholder="Opmerkingen / gecontroleerde onderdelen"></textarea><label><input type="checkbox" id="approved"> Voertuig goedgekeurd / APK geldig</label><button id="inspect">APK-keuring opslaan</button><button id="serviceRecord">Kleine beurt registreren</button></div></section><section id="werkplaats" class="page"><h2>Werkplaats & crafting</h2><div class="grid" id="recipes"></div><p class="hint">Craften is alleen beschikbaar voor pechhulpmedewerkers die in dienst zijn. Materialen moeten in je THOOTJE-INVENTORY zitten.</p></section><section id="facturen" class="page"><h2>Facturatieoverzicht</h2><div id="invoices" class="grid"></div><div class="panel form"><h3>Handmatige factuur</h3><input id="target" type="number" placeholder="Server ID klant"><input id="amount" type="number" placeholder="Bedrag (€)"><input id="description" placeholder="Omschrijving"><button id="sendInvoice">Factuur versturen</button></div></section></main><script src="app.js"></script></body></html>
